    <title>MDRS School</title>
    <style>
      html.pwa-boot-active,
      html.pwa-boot-active body {
        background-color: #121212;
        min-height: 100%;
      }

      #pwa-boot {
        position: fixed;
        inset: 0;
        z-index: 2147483647;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #121212;
        transition:
          opacity 0.55s cubic-bezier(0.4, 0, 0.2, 1),
          transform 0.55s cubic-bezier(0.4, 0, 0.2, 1),
          visibility 0s linear 0.55s;
      }

      #pwa-boot.pwa-boot--hide {
        opacity: 0;
        transform: scale(1.04);
        visibility: hidden;
        pointer-events: none;
      }

      #pwa-boot .pwa-boot__inner {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 28px;
        animation: pwaBootReveal 0.65s cubic-bezier(0.22, 1, 0.36, 1) 0.05s both;
      }

      #pwa-boot .pwa-boot__logo-wrap {
        padding: 10px;
        border-radius: 22%;
        background: rgba(255, 255, 255, 0.03);
        box-shadow:
          0 20px 56px rgba(0, 0, 0, 0.55),
          0 0 0 1px rgba(255, 255, 255, 0.05) inset;
        animation: pwaBootLogoFloat 2.2s ease-in-out infinite;
      }

      #pwa-boot img {
        display: block;
        width: clamp(120px, 38vw, 188px);
        height: auto;
        object-fit: contain;
        border-radius: 20%;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
      }

      .pwa-boot__spinner {
        width: 26px;
        height: 26px;
        border: 2px solid rgba(255, 255, 255, 0.12);
        border-top-color: rgba(235, 179, 37, 0.85);
        border-radius: 50%;
        animation: pwaBootSpin 0.85s linear infinite;
      }

      @keyframes pwaBootReveal {
        from {
          opacity: 0;
          transform: scale(0.94) translateY(8px);
        }
        to {
          opacity: 1;
          transform: scale(1) translateY(0);
        }
      }

      @keyframes pwaBootLogoFloat {
        0%,
        100% {
          transform: translateY(0);
        }
        50% {
          transform: translateY(-3px);
        }
      }

      @keyframes pwaBootSpin {
        to {
          transform: rotate(360deg);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        #pwa-boot,
        #pwa-boot .pwa-boot__inner,
        #pwa-boot .pwa-boot__logo-wrap,
        .pwa-boot__spinner {
          animation: none !important;
        }

        #pwa-boot .pwa-boot__inner {
          opacity: 1;
          transform: none;
        }

        #pwa-boot {
          transition-duration: 0.15s;
        }
      }

      #pwa-update-toast {
        position: fixed;
        z-index: 2147483646;
        left: 50%;
        bottom: max(20px, env(safe-area-inset-bottom, 20px));
        transform: translateX(-50%) translateY(120%);
        max-width: min(420px, calc(100vw - 32px));
        padding: 12px 14px;
        display: flex;
        align-items: center;
        gap: 12px;
        font-family:
          system-ui,
          -apple-system,
          'Segoe UI',
          Roboto,
          sans-serif;
        font-size: 14px;
        line-height: 1.35;
        color: rgba(255, 255, 255, 0.92);
        background: rgba(24, 24, 27, 0.92);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 14px;
        box-shadow: 0 12px 40px rgba(0, 0, 0, 0.35);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        opacity: 0;
        pointer-events: none;
        transition:
          transform 0.4s cubic-bezier(0.22, 1, 0.36, 1),
          opacity 0.35s ease;
      }

      #pwa-update-toast.pwa-update-toast--visible {
        transform: translateX(-50%) translateY(0);
        opacity: 1;
        pointer-events: auto;
      }

      #pwa-update-toast .pwa-update-toast__msg {
        flex: 1;
        min-width: 0;
      }

      #pwa-update-toast button {
        flex-shrink: 0;
        cursor: pointer;
        border: none;
        border-radius: 10px;
        padding: 8px 14px;
        font-size: 13px;
        font-weight: 600;
        color: #0f172a;
        background: linear-gradient(180deg, #f4d03f 0%, #ebb325 100%);
        box-shadow: 0 1px 0 rgba(255, 255, 255, 0.25) inset;
      }

      #pwa-update-toast button:active {
        transform: scale(0.98);
      }
    </style>
  </head>
  <body>
    <div id="pwa-boot" aria-hidden="true">
      <div class="pwa-boot__inner">
        <div class="pwa-boot__logo-wrap">
          <img src="/icon-192.png" alt="" width="192" height="192" decoding="async" fetchpriority="high" />
        </div>
        <div class="pwa-boot__spinner"></div>
      </div>
    </div>
    <div id="root"></div>

    <div id="pwa-update-toast" role="status" aria-live="polite" aria-atomic="true" hidden>
      <span class="pwa-update-toast__msg">New version available — refresh to update.</span>
      <button type="button" id="pwa-update-toast-refresh">Refresh</button>
    </div>

    <script>
      ;(function () {
        var boot = document.getElementById('pwa-boot')
        var root = document.getElementById('root')
        var done = false
        var failsafe = null
        var hideDelayMs = 560

        function hide() {
          if (done || !boot) return
          done = true
          if (failsafe != null) clearTimeout(failsafe)
          document.documentElement.classList.remove('pwa-boot-active')
          boot.classList.add('pwa-boot--hide')
          setTimeout(function () {
            boot.remove()
          }, hideDelayMs)
        }

        function scheduleHide() {
          requestAnimationFrame(function () {
            requestAnimationFrame(function () {
              setTimeout(hide, 32)
            })
          })
        }

        if (!boot) return

        if (root && root.childElementCount > 0) {
          scheduleHide()
          return
        }

        if (root && typeof MutationObserver !== 'undefined') {
          var mo = new MutationObserver(function () {
            if (root.childElementCount > 0) {
              mo.disconnect()
              scheduleHide()
            }
          })
          mo.observe(root, { childList: true, subtree: true })
        }

        failsafe = setTimeout(hide, 12000)
      })()
    </script>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      ;(function () {
        window.addEventListener('load', function () {
          if (!('serviceWorker' in navigator)) return

          var toast = document.getElementById('pwa-update-toast')
          var btn = document.getElementById('pwa-update-toast-refresh')
          if (!toast || !btn) return

          var bound = false

          function showToast() {
            toast.hidden = false
            toast.offsetHeight
            toast.classList.add('pwa-update-toast--visible')
          }

          function wire(reg) {
            if (bound) return
            bound = true
            btn.addEventListener('click', function () {
              if (reg.waiting) {
                reg.waiting.postMessage({ type: 'SKIP_WAITING' })
              }
              var reloaded = false
              function reloadOnce() {
                if (reloaded) return
                reloaded = true
                window.location.reload()
              }
              navigator.serviceWorker.addEventListener('controllerchange', reloadOnce)
              setTimeout(reloadOnce, 2000)
            })
          }

          function onWaiting(reg) {
            if (!reg.waiting || !navigator.serviceWorker.controller) return
            showToast()
            wire(reg)
          }

          navigator.serviceWorker.getRegistration().then(function (reg) {
            if (!reg) return
            onWaiting(reg)
            reg.addEventListener('updatefound', function () {
              var iw = reg.installing
              if (!iw) return
              iw.addEventListener('statechange', function () {
                if (iw.state === 'installed') onWaiting(reg)
              })
            })
          })
        })
      })()
    </script>
  </body>
</html>
