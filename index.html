    </div>

    <div id="pwa-welcome" hidden aria-hidden="true">
      <div class="pwa-welcome__inner">
        <img class="pwa-welcome__logo" src="/icon-192-v2.png" alt="" width="120" height="120" decoding="async" />
        <p class="pwa-welcome__title">Welcome back to MDRS School</p>
        <p class="pwa-welcome__sub">Excellence • Discipline • Success</p>
      </div>
    </div>

    <div id="root"></div>

    <div id="pwa-offline-bar" class="pwa-chrome-offline" hidden aria-live="polite">
      <span class="pwa-offline-bar__icon" aria-hidden="true">☁</span>
      <span class="pwa-offline-bar__text">You're offline</span>
    </div>

    <div id="pwa-install-banner" class="pwa-chrome-install" hidden aria-hidden="true">
      <div class="pwa-chrome-install__inner">
        <img
          class="pwa-chrome-install__icon"
          src="/icon-192-v2.png"
          alt=""
          width="40"
          height="40"
          decoding="async"
        />
        <span class="pwa-chrome-install__text">Install for quick access and a full-screen experience.</span>
        <button type="button" id="pwa-install-btn" class="pwa-chrome-install__btn">Install App</button>
        <button type="button" id="pwa-install-dismiss" class="pwa-chrome-install__dismiss" aria-label="Dismiss">
          ×
        </button>

    <div id="pwa-update-toast" role="status" aria-live="polite" aria-atomic="true" hidden>
      <span class="pwa-update-toast__spin" aria-hidden="true"></span>
      <span class="pwa-update-toast__msg">New version available 🚀</span>
      <button type="button" id="pwa-update-toast-refresh">Update Now</button>
      <button type="button" id="pwa-update-toast-dismiss" aria-label="Dismiss update">×</button>
    </div>

    <script>
      ;(function () {
        var boot = document.getElementById('pwa-boot')
        var root = document.getElementById('root')
        var done = false
        var failsafe = null
        var hideDelayMs = 560

        function hide() {
          if (done || !boot) return
          done = true
          if (failsafe != null) clearTimeout(failsafe)
          document.documentElement.classList.remove('pwa-boot-active')
          boot.classList.add('pwa-boot--hide')
          setTimeout(function () {
            boot.remove()
            try {
              window.dispatchEvent(new Event('pwa-boot-dismissed'))
            } catch (e) {}
          }, hideDelayMs)
        }

        function scheduleHide() {
          requestAnimationFrame(function () {
            requestAnimationFrame(function () {
              setTimeout(hide, 32)
            })
          })
        }

        if (!boot) return

        if (root && root.childElementCount > 0) {
          scheduleHide()
          return
        }

        if (root && typeof MutationObserver !== 'undefined') {
          var mo = new MutationObserver(function () {
            if (root.childElementCount > 0) {
              mo.disconnect()
              scheduleHide()
            }
          })
          mo.observe(root, { childList: true, subtree: true })
        }

        failsafe = setTimeout(hide, 12000)
      })()
    </script>
    <script>
      ;(function () {
        var SESSION_KEY = 'mdrs_pwa_welcome_once_v2'
        function dismissWelcome(el) {
          el.classList.remove('pwa-welcome--on', 'pwa-welcome--play')
          el.classList.add('pwa-welcome--out')
          setTimeout(function () {
            el.remove()
          }, 580)
        }
        function runWelcome() {
          var el = document.getElementById('pwa-welcome')
          if (!el) return
          if (sessionStorage.getItem(SESSION_KEY)) return
          if (el.dataset.welcomeStarted === '1') return
          el.dataset.welcomeStarted = '1'

          var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches
          if (reduce) {
            sessionStorage.setItem(SESSION_KEY, '1')
            el.remove()
            return
          }

          el.removeAttribute('hidden')
          el.setAttribute('aria-hidden', 'false')

          requestAnimationFrame(function () {
            requestAnimationFrame(function () {
              el.classList.add('pwa-welcome--on')
              el.classList.add('pwa-welcome--play')
              var inner = el.querySelector('.pwa-welcome__inner')
              if (!inner) return
              inner.addEventListener(
                'animationend',
                function onEnd() {
                  inner.removeEventListener('animationend', onEnd)
                  try {
                    sessionStorage.setItem(SESSION_KEY, '1')
                  } catch (e) {}
                  dismissWelcome(el)
                },
                { once: true },
              )
            })
          })
        }

        window.addEventListener('pwa-boot-dismissed', runWelcome)
      })()
    </script>
    <script defer src="/pwa-chrome.js"></script>
    <script type="module" src="/src/main.jsx"></script>
