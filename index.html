    <link

    <title>MDRS School</title>
    <style>
      html.pwa-boot-active,
      html.pwa-boot-active body {
        background-color: #000;
        min-height: 100%;
      }

      /* Below React app (cinematic intro z-index 9999) — no logo, solid screen until root mounts */
      #pwa-boot {
        position: fixed;
        inset: 0;
        z-index: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #000;
        transition:
          opacity 0.55s cubic-bezier(0.4, 0, 0.2, 1),
          transform 0.55s cubic-bezier(0.4, 0, 0.2, 1),
          visibility 0s linear 0.55s;
      }

      #pwa-boot.pwa-boot--hide {
        opacity: 0;
        transform: scale(1.04);
        visibility: hidden;
        pointer-events: none;
      }

      #pwa-boot .pwa-boot__inner {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 0;
        animation: pwaBootReveal 0.65s cubic-bezier(0.22, 1, 0.36, 1) 0.05s both;
      }

      .pwa-boot__spinner {
        width: 26px;
        height: 26px;
        border: 2px solid rgba(255, 255, 255, 0.12);
        border-top-color: rgba(235, 179, 37, 0.85);
        border-radius: 50%;
        animation: pwaBootSpin 0.85s linear infinite;
      }

      @keyframes pwaBootReveal {
        from {
          opacity: 0;
          transform: scale(0.94) translateY(8px);
        }
        to {
          opacity: 1;
          transform: scale(1) translateY(0);
        }
      }

      @keyframes pwaBootSpin {
        to {
          transform: rotate(360deg);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        #pwa-boot,
        #pwa-boot .pwa-boot__inner,
        .pwa-boot__spinner {
          animation: none !important;
        }

        #pwa-boot .pwa-boot__inner {
          opacity: 1;
          transform: none;
        }

        #pwa-boot {
          transition-duration: 0.15s;
        }
      }

      /* Welcome overlay disabled — launcher icon stays in manifest / favicon only */
      #pwa-welcome {
        display: none !important;
      }

      /* —— PWA “Play Store” chrome (install / offline / global feel) —— */
      html {
        scroll-behavior: smooth;
      }

      @media (prefers-reduced-motion: reduce) {
        html {
          scroll-behavior: auto;
        }
      }

      body,
      body *:not(input):not(textarea):not(select):not([contenteditable='true']):not(option) {
        -webkit-user-select: none;
        user-select: none;
      }

      input,
      textarea,
      select,
      [contenteditable='true'],
      .pwa-allow-select {
        -webkit-user-select: text;
        user-select: text;
      }

      html {
        -webkit-tap-highlight-color: rgba(251, 191, 36, 0.15);
      }

      a,
      button,
      [role='button'],
      input[type='submit'],
      input[type='button'],
      input[type='reset'],
      label {
        transition: transform 0.14s ease, opacity 0.14s ease;
      }

      @media (hover: none) and (pointer: coarse) {
        a:active,
        button:active,
        [role='button']:active,
        input[type='submit']:active,
        input[type='button']:active,
        input[type='reset']:active {
          transform: scale(0.98);
          filter: brightness(1.07);
        }
      }

      /* Do not animate root opacity — it hides CinematicIntro inside #root on first paint */
      #root.pwa-root--mounted {
        animation: pwaRootFadeIn 0.38s cubic-bezier(0.22, 1, 0.36, 1) forwards;
      }

      @keyframes pwaRootFadeIn {
        from {
          transform: translateY(10px);
        }
        to {
          transform: translateY(0);
        }
      }

      /* Haptic visual fallback (class toggled from JS) */
      html.pwa-chrome-haptic-flash::before {
        content: '';
        position: fixed;
        inset: 0;
        z-index: 2147483645;
        pointer-events: none;
        background: radial-gradient(circle at 50% 80%, rgba(251, 191, 36, 0.14), transparent 55%);
        opacity: 1;
        animation: pwaHapticFlash 0.14s ease-out forwards;
      }

      @keyframes pwaHapticFlash {
        to {
          opacity: 0;
        }
      }

      /* Offline top bar */
      #pwa-offline-bar {
        position: fixed;
        z-index: 2147483630;
        top: 0;
        left: 0;
        right: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        padding: 10px max(16px, env(safe-area-inset-right)) 10px max(16px, env(safe-area-inset-left));
        padding-top: max(10px, env(safe-area-inset-top));
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        font-size: 13px;
        font-weight: 600;
        letter-spacing: 0.02em;
        color: rgba(255, 255, 255, 0.95);
        background: rgba(18, 18, 18, 0.88);
        border-bottom: 1px solid rgba(251, 191, 36, 0.28);
        backdrop-filter: blur(18px);
        -webkit-backdrop-filter: blur(18px);
        box-shadow: 0 10px 28px rgba(0, 0, 0, 0.38);
        transform: translateY(-110%);
        opacity: 0;
        pointer-events: none;
        transition:
          transform 0.4s cubic-bezier(0.22, 1, 0.36, 1),
          opacity 0.32s ease;
      }

      #pwa-offline-bar .pwa-offline-bar__icon {
        font-size: 1.05rem;
        line-height: 1;
        opacity: 0.9;
      }

      #pwa-offline-bar .pwa-offline-bar__text {
        flex: 0 1 auto;
      }

      #pwa-offline-bar.pwa-chrome--visible {
        transform: translateY(0);
        opacity: 1;
        pointer-events: none;
      }

      /* Install bottom banner — slide up + fade */
      #pwa-install-banner {
        position: fixed;
        z-index: 2147483635;
        left: 50%;
        bottom: max(16px, env(safe-area-inset-bottom, 16px));
        transform: translateX(-50%) translateY(calc(100% + 32px));
        width: min(440px, calc(100vw - 28px));
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        opacity: 0;
        filter: blur(6px);
        pointer-events: none;
        transition:
          transform 0.48s cubic-bezier(0.22, 1, 0.36, 1),
          opacity 0.42s ease,
          filter 0.45s ease;
      }

      #pwa-install-banner.pwa-chrome--visible {
        transform: translateX(-50%) translateY(0);
        opacity: 1;
        filter: blur(0);
        pointer-events: auto;
      }

      #pwa-install-banner .pwa-chrome-install__inner {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 12px 14px;
        padding: 14px 16px;
        border-radius: 16px;
        background: rgba(28, 28, 30, 0.9);
        border: 1px solid rgba(255, 255, 255, 0.1);
        box-shadow:
          0 16px 48px rgba(0, 0, 0, 0.45),
          0 0 0 1px rgba(251, 191, 36, 0.1) inset;
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
      }

      #pwa-install-banner .pwa-chrome-install__icon {
        flex-shrink: 0;
        width: 40px;
        height: 40px;
        border-radius: 22%;
        object-fit: cover;
        box-shadow: 0 4px 14px rgba(0, 0, 0, 0.35);
      }

      #pwa-install-banner .pwa-chrome-install__text {
        flex: 1 1 140px;
        min-width: 0;
        font-size: 13px;
        line-height: 1.4;
        color: rgba(255, 255, 255, 0.88);
      }

      #pwa-install-banner .pwa-chrome-install__btn {
        position: relative;
        overflow: hidden;
        flex-shrink: 0;
        cursor: pointer;
        border: none;
        border-radius: 12px;
        padding: 10px 18px;
        font-size: 14px;
        font-weight: 700;
        color: #121212;
        background: linear-gradient(180deg, #fde68a 0%, #fbbf24 48%, #d97706 100%);
        box-shadow: 0 1px 0 rgba(255, 255, 255, 0.35) inset;
        animation: pwaInstallBtnPulse 2.2s ease-in-out infinite;
      }

      #pwa-install-banner .pwa-chrome-install__btn::after {
        content: '';
        position: absolute;
        left: 50%;
        top: 50%;
        width: 120%;
        height: 120%;
        margin: -60% 0 0 -60%;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.35);
        opacity: 0;
        transform: scale(0);
        pointer-events: none;
      }

      #pwa-install-banner .pwa-chrome-install__btn:active {
        transform: scale(0.97);
        filter: brightness(1.08);
      }

      #pwa-install-banner .pwa-chrome-install__btn:active::after {
        animation: pwaRipple 0.5s ease-out;
      }

      #pwa-install-banner .pwa-chrome-install__dismiss {
        position: relative;
        overflow: hidden;
        flex-shrink: 0;
        cursor: pointer;
        border: none;
        width: 36px;
        height: 36px;
        border-radius: 10px;
        font-size: 20px;
        line-height: 1;
        color: rgba(255, 255, 255, 0.65);
        background: rgba(255, 255, 255, 0.06);
        transition: transform 0.12s ease, filter 0.12s ease, background 0.12s ease;
      }

      #pwa-install-banner .pwa-chrome-install__dismiss:active {
        transform: scale(0.95);
        filter: brightness(1.15);
      }

      @keyframes pwaInstallBtnPulse {
        0%,
        100% {
          box-shadow:
            0 1px 0 rgba(255, 255, 255, 0.35) inset,
            0 0 0 0 rgba(251, 191, 36, 0.35);
        }
        50% {
          box-shadow:
            0 1px 0 rgba(255, 255, 255, 0.35) inset,
            0 0 0 6px rgba(251, 191, 36, 0);
        }
      }

      @keyframes pwaRipple {
        0% {
          transform: scale(0);
          opacity: 0.45;
        }
        100% {
          transform: scale(1);
          opacity: 0;
        }
      }

      /* Offline / status flash toasts */
      #pwa-offline-flash {
        position: fixed;
        z-index: 2147483633;
        left: 50%;
        bottom: max(100px, calc(env(safe-area-inset-bottom, 16px) + 84px));
        transform: translateX(-50%) translateY(16px);
        max-width: min(360px, calc(100vw - 32px));
        padding: 12px 18px;
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        font-size: 13px;
        font-weight: 500;
        text-align: center;
        color: rgba(255, 255, 255, 0.95);
        background: rgba(30, 30, 32, 0.92);
        border: 1px solid rgba(251, 191, 36, 0.35);
        border-radius: 14px;
        box-shadow: 0 12px 36px rgba(0, 0, 0, 0.4);
        backdrop-filter: blur(14px);
        -webkit-backdrop-filter: blur(14px);
        opacity: 0;
        pointer-events: none;
        transition:
          transform 0.32s cubic-bezier(0.22, 1, 0.36, 1),
          opacity 0.28s ease;
      }

      #pwa-offline-flash.pwa-chrome--visible {
        transform: translateX(-50%) translateY(0);
        opacity: 1;
      }

      #pwa-offline-flash.pwa-chrome--success {
        border-color: rgba(52, 211, 153, 0.45);
      }

      /* Update toast — premium slide + blur */
      #pwa-update-toast {
        position: fixed;
        z-index: 2147483646;
        left: 50%;
        bottom: max(96px, calc(env(safe-area-inset-bottom, 16px) + 80px));
        transform: translateX(-50%) translateY(calc(100% + 40px));
        max-width: min(420px, calc(100vw - 32px));
        padding: 14px 16px;
        display: flex;
        align-items: center;
        gap: 12px;
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        font-size: 14px;
        line-height: 1.35;
        color: rgba(255, 255, 255, 0.94);
        background: rgba(28, 28, 30, 0.94);
        border: 1px solid rgba(251, 191, 36, 0.22);
        border-radius: 16px;
        box-shadow:
          0 16px 48px rgba(0, 0, 0, 0.42),
          0 0 0 1px rgba(255, 255, 255, 0.06) inset;
        backdrop-filter: blur(22px);
        -webkit-backdrop-filter: blur(22px);
        opacity: 0;
        filter: blur(8px);
        pointer-events: none;
        transition:
          transform 0.45s cubic-bezier(0.22, 1, 0.36, 1),
          opacity 0.4s ease,
          filter 0.45s ease;
      }

      #pwa-update-toast.pwa-update-toast--visible {
        transform: translateX(-50%) translateY(0);
        opacity: 1;
        filter: blur(0);
        pointer-events: auto;
      }

      #pwa-update-toast .pwa-update-toast__spin {
        display: inline-block;
        flex-shrink: 0;
        width: 20px;
        height: 20px;
        border: 2px solid rgba(255, 255, 255, 0.12);
        border-top-color: #fbbf24;
        border-radius: 50%;
        vertical-align: middle;
        animation: pwaUpdateSpin 0.75s linear infinite;
      }

      #pwa-update-toast.pwa-update-toast--ready .pwa-update-toast__spin {
        opacity: 0.35;
        animation-duration: 1.4s;
      }

      @keyframes pwaUpdateSpin {
        to {
          transform: rotate(360deg);
        }
      }

      #pwa-update-toast .pwa-update-toast__msg {
        flex: 1;
        min-width: 0;
      }

      #pwa-update-toast-refresh {
        position: relative;
        overflow: hidden;
        flex-shrink: 0;
        cursor: pointer;
        border: none;
        border-radius: 12px;
        padding: 9px 16px;
        font-size: 13px;
        font-weight: 700;
        color: #121212;
        background: linear-gradient(180deg, #fde68a 0%, #fbbf24 50%, #d97706 100%);
        box-shadow: 0 1px 0 rgba(255, 255, 255, 0.28) inset;
        transition: transform 0.12s ease, filter 0.12s ease;
      }

      #pwa-update-toast-refresh:active {
        transform: scale(0.97);
        filter: brightness(1.08);
      }

      #pwa-update-toast-refresh::after {
        content: '';
        position: absolute;
        left: 50%;
        top: 50%;
        width: 100%;
        height: 100%;
        margin: -50% 0 0 -50%;
        border-radius: inherit;
        background: rgba(255, 255, 255, 0.35);
        opacity: 0;
        transform: scale(0);
        pointer-events: none;
      }

      #pwa-update-toast-refresh:active::after {
        animation: pwaRipple 0.48s ease-out;
      }

      #pwa-update-toast-dismiss {
        flex-shrink: 0;
        cursor: pointer;
        border: none;
        width: 34px;
        height: 34px;
        border-radius: 10px;
        font-size: 18px;
        line-height: 1;
        color: rgba(255, 255, 255, 0.55);
        background: rgba(255, 255, 255, 0.06);
        transition: transform 0.12s ease, filter 0.12s ease, color 0.12s ease;
      }

      #pwa-update-toast-dismiss:hover {
        color: rgba(255, 255, 255, 0.85);
      }

      #pwa-update-toast-dismiss:active {
        transform: scale(0.94);
        filter: brightness(1.12);
      }

      @media (prefers-reduced-motion: reduce) {
        #pwa-install-banner,
        #pwa-install-banner.pwa-chrome--visible,
        #pwa-offline-bar,
        #pwa-offline-bar.pwa-chrome--visible,
        #pwa-offline-flash,
        #pwa-update-toast,
        #pwa-update-toast.pwa-update-toast--visible {
          transition: none !important;
          filter: none !important;
        }

        #pwa-install-banner {
          transform: translateX(-50%) translateY(calc(100% + 32px));
        }

        #pwa-install-banner.pwa-chrome--visible {
          transform: translateX(-50%) translateY(0);
        }

        #pwa-install-banner .pwa-chrome-install__btn {
          animation: none !important;
        }

        #pwa-update-toast .pwa-update-toast__spin {
          animation: none !important;
          opacity: 0.5;
        }

        #root.pwa-root--mounted {
          animation: none !important;
          opacity: 1;
          transform: none;
        }

        html.pwa-chrome-haptic-flash::before {
          animation: none !important;
          opacity: 0 !important;
        }
      }
    </style>
  </head>
  <body>
    <div id="pwa-boot" aria-hidden="true">
      <div class="pwa-boot__inner">
        <div class="pwa-boot__spinner"></div>
      </div>
    </div>

    <div id="root"></div>

    <div id="pwa-offline-bar" class="pwa-chrome-offline" hidden aria-live="polite">
      <span class="pwa-offline-bar__icon" aria-hidden="true">☁</span>
      <span class="pwa-offline-bar__text">You're offline</span>
    </div>

    <div id="pwa-install-banner" class="pwa-chrome-install" hidden aria-hidden="true">
      <div class="pwa-chrome-install__inner">
        <img
          class="pwa-chrome-install__icon"
          src="/icon-192.png"
          alt=""
          width="40"
          height="40"
          decoding="async"
        />
        <span class="pwa-chrome-install__text">Install for quick access and a full-screen experience.</span>
        <button type="button" id="pwa-install-btn" class="pwa-chrome-install__btn">Install App</button>
        <button type="button" id="pwa-install-dismiss" class="pwa-chrome-install__dismiss" aria-label="Dismiss">
          ×
        </button>
      </div>
    </div>

    <div id="pwa-offline-flash" class="pwa-chrome-offline-flash" hidden role="status" aria-live="polite"></div>

    <div id="pwa-update-toast" role="status" aria-live="polite" aria-atomic="true" hidden>
      <span class="pwa-update-toast__spin" aria-hidden="true"></span>
      <span class="pwa-update-toast__msg">New version available 🚀</span>
      <button type="button" id="pwa-update-toast-refresh">Update Now</button>
      <button type="button" id="pwa-update-toast-dismiss" aria-label="Dismiss update">×</button>
    </div>

    <script>
      ;(function () {
        var boot = document.getElementById('pwa-boot')
        var root = document.getElementById('root')
        var done = false
        var failsafe = null
        var hideDelayMs = 560

        function hide() {
          if (done || !boot) return
          done = true
          if (failsafe != null) clearTimeout(failsafe)
          document.documentElement.classList.remove('pwa-boot-active')
          boot.classList.add('pwa-boot--hide')
          setTimeout(function () {
            boot.remove()
            try {
              window.dispatchEvent(new Event('pwa-boot-dismissed'))
            } catch (e) {}
          }, hideDelayMs)
        }

        function scheduleHide() {
          requestAnimationFrame(function () {
            requestAnimationFrame(function () {
              setTimeout(hide, 32)
            })
          })
        }

        if (!boot) return

        if (root && root.childElementCount > 0) {
          scheduleHide()
          return
        }

        if (root && typeof MutationObserver !== 'undefined') {
          var mo = new MutationObserver(function () {
            if (root.childElementCount > 0) {
              mo.disconnect()
              scheduleHide()
            }
          })
          mo.observe(root, { childList: true, subtree: true })
        }

        failsafe = setTimeout(hide, 12000)
      })()
    </script>
    <script defer src="/pwa-chrome.js"></script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
